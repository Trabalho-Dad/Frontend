<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Astra Store - Finalizar Pedido</title>
  
  <link rel="stylesheet" href="css/base/reset.css">
  <link rel="stylesheet" href="css/base/variables.css">
  <link rel="stylesheet" href="css/base/global.css">
  <link rel="stylesheet" href="css/components/header.css">
  <link rel="stylesheet" href="css/components/footer.css">
  <link rel="stylesheet" href="css/components/modal.css">
  
  <link rel="stylesheet" href="css/pages/checkout.css">
</head>
<body>

  <header class="navbar">
    <div class="nav-container">
      <a href="index.html" class="brand-logo">
        <span class="logo-icon">✦</span>
        <span class="logo-text">astra</span>
      </a>

      <nav class="nav-links">
        <a href="index.html">Início</a>
        <a href="catalogo.html">Catálogo</a>
      </nav>

      <div class="nav-actions">
        <a href="checkout.html" class="icon-btn cart-btn" title="Carrinho">
          🛒 <span id="cart-count" class="badge">0</span>
        </a>
      </div>
    </div>
  </header>

  <main class="checkout-container">
    
    <h1 class="checkout-title">Finalizar Pedido</h1>

    <div class="checkout-grid">
      
      <div class="checkout-steps">
        
        <section class="checkout-box">
          <h2>1. Seus Itens</h2>
          <div id="cart-items-list" class="cart-items-list">
            <p class="empty-cart-msg">Seu carrinho está vazio.</p>
          </div>
        </section>

        <section class="checkout-box">
          <div class="box-header">
            <h2>2. Endereço de Entrega</h2>
            <button type="button" id="btn-open-address-modal" class="btn-secondary-sm">+ Novo Endereço</button>
          </div>
          
          <div id="addresses-container" class="addresses-container">
            <p class="loading-text">Carregando seus endereços...</p>
          </div>
        </section>

        <section class="checkout-box">
          <h2>3. Forma de Pagamento</h2>
          <div class="payment-options">
            <label class="payment-card">
              <input type="radio" name="payment" value="PIX" checked>
              <span>⚡ PIX (Aprovação Instantânea)</span>
            </label>
            <label class="payment-card">
              <input type="radio" name="payment" value="CREDIT_CARD">
              <span>💳 Cartão de Crédito</span>
            </label>
            <label class="payment-card">
              <input type="radio" name="payment" value="BOLETO">
              <span>📄 Boleto Bancário</span>
            </label>
          </div>
        </section>

      </div>

      <aside class="checkout-summary">
        <div class="checkout-box summary-box">
          <h2>Resumo da Compra</h2>
          
          <div class="summary-row">
            <span>Subtotal</span>
            <span id="summary-subtotal">R$ 0,00</span>
          </div>

          <div class="summary-row">
            <span>Frete</span>
            <span id="summary-shipping">R$ 0,00</span>
          </div>

          <div class="summary-row total">
            <span>Total</span>
            <span id="summary-total">R$ 0,00</span>
          </div>

          <button type="button" id="btn-finish-order" class="btn-finish">Concluir Compra</button>
        </div>
      </aside>

    </div>
  </main>

  <div id="address-modal" class="modal-overlay hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Adicionar Novo Endereço</h3>
        <button type="button" id="btn-close-modal" class="close-btn">&times;</button>
      </div>

      <form id="address-form" class="address-form">
        <div class="form-group">
          <label for="cep">CEP</label>
          <input type="text" id="cep" name="cep" class="form-control" placeholder="00000-000" required>
        </div>

        <div class="form-row">
          <div class="form-group flex-2">
            <label for="street">Rua/Avenida</label>
            <input type="text" id="street" name="street" class="form-control" required>
          </div>
          <div class="form-group flex-1">
            <label for="number">Número</label>
            <input type="text" id="number" name="number" class="form-control" required>
          </div>
        </div>

        <div class="form-group">
          <label for="complement">Complemento</label>
          <input type="text" id="complement" name="complement" class="form-control" placeholder="Apto, Bloco, etc.">
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="neighborhood">Bairro</label>
            <input type="text" id="neighborhood" name="neighborhood" class="form-control" required>
          </div>
          <div class="form-group">
            <label for="city">Cidade</label>
            <input type="text" id="city" name="city" class="form-control" required>
          </div>
          <div class="form-group flex-small">
            <label for="state">UF</label>
            <input type="text" id="state" name="state" class="form-control" maxlength="2" required>
          </div>
        </div>

        <button type="submit" class="btn-finish" style="margin-top: 12px;">Salvar Endereço</button>
      </form>
    </div>
  </div>

  <footer class="footer">
    <div class="footer-container">
      <div class="footer-brand">
        <a href="index.html" class="brand-logo">
          <span class="logo-icon"></span>
          <span class="logo-text">astra</span>
        </a>
      </div>
    </div>
  </footer>

  <script type="module" src="js/pages/checkout.js"></script>
</body>
</html>
