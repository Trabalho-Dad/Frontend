<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="./../../css/pages/login.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="./../../assets/icons/logo.jpg" type="image/x-icon">
    <link rel="stylesheet" href="./../../css/components/loading.css">
    <link rel="stylesheet" href="./../../css/theme.css">
    <script src="./../../js/theme.js"></script>
    <title>Astra - Alterar senha</title>
</head>

<body>
    <div class="background">

        <div class="card">

            <div class="logo">
                <img src="./../../assets/images/logoAstra.png" alt="astra logo">
            </div>

            <div>
                <h1>Bom te ver de novo!</h1>
                <p class="subtitulo">
                    Por favor, entre com suas credenciais
                </p>
            </div>

            <form>

                <div class="inputt">
                    <label>Nova senha</label>
                    <input type="password" placeholder="Digite sua nova senha aqui" id="newPassword">
                </div>

                <div class="inputt">
                    <label>Confirme sua senha</label>
                    <input type="password" placeholder="Confirme sua senha aqui" id="confirmPassword">
                </div>

                <p id="error" class="error"></p>

                <button type="submit">Confirmar</button>

            </form>

        </div>

    </div>

    <script type="module" src="./../../js/pages/change-password.js"></script>
</body>

</html>
