<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="./../../css/pages/login.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="./../../assets/icons/logo.jpg" type="image/x-icon">
    <link rel="stylesheet" href="./../../css/components/loading.css">
    <link rel="stylesheet" href="./../../css/theme.css">
    <script src="./../../js/theme.js"></script>
    <title>Astra - Validar código</title>
</head>

<body>
    <div class="background">

        <div class="card">

            <div class="logo">
                <a href="./send-code.html" class="voltar" aria-label="Voltar para a página inicial">
                    <span class="material-symbols-outlined">arrow_back</span>
                </a>
                <img src="./../../assets/images/logoAstra.png" alt="astra logo">
            </div>

            <div>
                <h1>Validação</h1>
                <p class="subtitulo">
                    Digite o código enviado para o seu e-mail
                </p>
            </div>

            <form>

                <div class="inputt">
                    <label>Código</label>
                    <input type="text" placeholder="Digite o código aqui" id="code">
                </div>

                <p id="error" class="error"></p>

                <button type="submit">Enviar</button>

                <p class="bottom-link">
                    <a href="./login.html" id="abrirPopup">Cancelar</a>
                </p>

            </form>

        </div>

    </div>

    <script type="module" src="./../../js/pages/validate-code.js"></script>
</body>

</html>
