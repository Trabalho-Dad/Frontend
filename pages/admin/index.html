<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="./../../css/base/reset.css">
  <link rel="stylesheet" href="./../../css/base/variables.css">
  <link rel="stylesheet" href="./../../css/base/global.css">
  <link rel="stylesheet" href="./../../css/components/header.css">
  <link rel="stylesheet" href="./../../css/components/loading.css">
  <link rel="stylesheet" href="./../../css/components/modal.css">
  <link rel="stylesheet" href="./../../css/pages/admin-home.css">
  <link rel="stylesheet" href="./../../css/theme.css">
  <script src="./../../js/theme.js"></script>

  <link rel="shortcut icon" href="./../../assets/icons/logo.jpg" type="image/x-icon">

  <title>Astra - Administrativo</title>
</head>

<body>
  <header class="navbar">
    <div class="nav-container">
      <a href="./../../index.html" class="brand-logo">
        <img class="logo-icon" src="./../../assets/images/logo.png" alt="logo">
        <span class="logo-text">astra</span>
      </a>

      <nav class="nav-links" id="nav-links">
        <a href="./../../index.html">Início</a>
        <a href="./../../catalogo.html">Catálogo</a>
        <a href="./../../sobre.html">Sobre nós</a>
      </nav>

      <nav class="nav-actions">
        <a href="./../../favorites.html" class="icon-btn" title="favorites"><img src="./../../assets/icons/favorito.svg"
            alt="favorites"></a>
        <a href="./../../carrinho.html" class="icon-btn cart-btn" title="Carrinho"><img
            src="./../../assets/icons/comprar.svg" alt="carrinho"> <span id="cart-count" class="badge">0</span>
        </a>
        <a href="./../auth/login.html" class="btn-login" id="login-link">Entrar</a>
      </nav>
    </div>
  </header>

  <div class="admin-layout">
    <aside class="admin-sidebar">
      <p class="admin-sidebar-title">Gestão</p>
      <a class="admin-nav-btn active" href="./index.html">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
          <path d="M9 22V12h6v10" />
        </svg>
        Home
      </a>

      <a class="admin-nav-btn" href="./figures.html">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path
            d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z" />
          <polyline points="3.27 6.96 12 12.01 20.73 6.96" />
          <line x1="12" y1="22.08" x2="12" y2="12" />
        </svg>
        Bonecos
      </a>

      <a class="admin-nav-btn" href="./categories.html">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
        </svg>
        Categorias
      </a>

      <a class="admin-nav-btn" href="./characters.html">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="7" r="4" />
          <path d="M5.5 21a6.5 6.5 0 0 1 13 0" />
        </svg>
        Personagens
      </a>

      <a class="admin-nav-btn" href="./coupons.html">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path
            d="M2 9V7a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v2a2 2 0 0 0 0 6v2a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-2a2 2 0 0 0 0-6z" />
          <line x1="9" y1="5" x2="9" y2="19" stroke-dasharray="2,2" />
        </svg>
        Cupons
      </a>
    </aside>

    <main class="admin-content">
      <div class="admin-section-header">
        <h1>Visão geral</h1>
      </div>

      <div class="kpi-grid" id="kpi-grid">
        <div class="kpi-card">
          <div class="kpi-icon kpi-icon-orders">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z" />
              <path d="M3 6h18" />
              <path d="M16 10a4 4 0 0 1-8 0" />
            </svg>
          </div>
          <div class="kpi-info">
            <span class="kpi-label">Pedidos (24h)</span>
            <span class="kpi-value" id="kpi-orders">--</span>
          </div>
        </div>

        <div class="kpi-card">
          <div class="kpi-icon kpi-icon-revenue">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="1" x2="12" y2="23" />
              <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6" />
            </svg>
          </div>
          <div class="kpi-info">
            <span class="kpi-label">Total recebido (24h)</span>
            <span class="kpi-value" id="kpi-revenue">--</span>
          </div>
        </div>

        <div class="kpi-card">
          <div class="kpi-icon kpi-icon-figures">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path
                d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z" />
              <polyline points="3.27 6.96 12 12.01 20.73 6.96" />
              <line x1="12" y1="22.08" x2="12" y2="12" />
            </svg>
          </div>
          <div class="kpi-info">
            <span class="kpi-label">Bonecos ativos</span>
            <span class="kpi-value" id="kpi-active-figures">--</span>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script type="module" src="./../../js/pages/admin-home.js"></script>
</body>

</html>
