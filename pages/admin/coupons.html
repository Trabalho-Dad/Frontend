<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="./../../css/base/reset.css">
  <link rel="stylesheet" href="./../../css/base/variables.css">
  <link rel="stylesheet" href="./../../css/base/global.css">
  <link rel="stylesheet" href="./../../css/components/header.css">
  <link rel="stylesheet" href="./../../css/components/loading.css">
  <link rel="stylesheet" href="./../../css/components/modal.css">
  <link rel="stylesheet" href="./../../css/components/pagination.css">
  <link rel="stylesheet" href="./../../css/pages/admin-home.css">
  <link rel="stylesheet" href="./../../css/theme.css">
  <script src="./../../js/theme.js"></script>

  <link rel="shortcut icon" href="./../../assets/icons/logo.jpg" type="image/x-icon">

  <title>Astra - Administrativo</title>
</head>

<body>
  <header class="navbar">
    <div class="nav-container">
      <a href="./../../index.html" class="brand-logo">
        <img class="logo-icon" src="./../../assets/images/logo.png" alt="logo">
        <span class="logo-text">astra</span>
      </a>

      <nav class="nav-links" id="nav-links">
        <a href="./../../index.html">Início</a>
        <a href="./../../catalogo.html">Catálogo</a>
        <a href="./../../sobre.html">Sobre nós</a>
      </nav>

      <nav class="nav-actions">
        <a href="./../../favorites.html" class="icon-btn" title="favorites"><img src="./../../assets/icons/favorito.svg"
            alt="favorites"></a>
        <a href="./../../carrinho.html" class="icon-btn cart-btn" title="Carrinho"><img
            src="./../../assets/icons/comprar.svg" alt="carrinho"> <span id="cart-count" class="badge">0</span>
        </a>
        <a href="./../auth/login.html" class="btn-login" id="login-link">Entrar</a>
      </nav>
    </div>
  </header>

  <div class="admin-layout">
    <aside class="admin-sidebar">
      <h2>Gestão</h2>
      <a class="admin-nav-btn" href="./index.html">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
          <path d="M9 22V12h6v10" />
        </svg>
        Home
      </a>

      <a class="admin-nav-btn" href="./figures.html">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path
            d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z" />
          <polyline points="3.27 6.96 12 12.01 20.73 6.96" />
          <line x1="12" y1="22.08" x2="12" y2="12" />
        </svg>
        Bonecos
      </a>

      <a class="admin-nav-btn" href="./categories.html">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
        </svg>
        Categorias
      </a>

      <a class="admin-nav-btn" href="./characters.html">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="7" r="4" />
          <path d="M5.5 21a6.5 6.5 0 0 1 13 0" />
        </svg>
        Personagens
      </a>

      <a class="admin-nav-btn active" href="./coupons.html">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path
            d="M2 9V7a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v2a2 2 0 0 0 0 6v2a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-2a2 2 0 0 0 0-6z" />
          <line x1="9" y1="5" x2="9" y2="19" stroke-dasharray="2,2" />
        </svg>
        Cupons
      </a>
    </aside>

    <main class="admin-content">
      <section class="admin-section" id="section-coupons">
        <div class="admin-section-header">
          <h1>Cupons de desconto</h1>
          <button class="btn-primary" id="btn-new-coupon">+ Novo cupom</button>
        </div>

        <div class="admin-table-wrapper">
          <table class="admin-table">
            <thead>
              <tr>
                <th>Código</th>
                <th>Desconto</th>
                <th>Uso</th>
                <th>Validade</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody id="coupons-table-body"></tbody>
          </table>
          <div class="admin-empty" id="coupons-empty" style="display:none;">Nenhum cupom cadastrado ainda.</div>
        </div>

        <div id="coupons-pagination" class="pagination"></div>
      </section>
    </main>
  </div>

  <div id="coupon-modal" class="modal-overlay hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h3>Novo cupom</h3>
        <button type="button" class="close-btn" data-close-modal="coupon-modal">&times;</button>
      </div>
      <form id="coupon-form">
        <div class="form-group">
          <label for="coupon-code-input">Código</label>
          <input type="text" id="coupon-code-input" class="form-control" required minlength="2"
            style="text-transform:uppercase;">
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="coupon-discount">Desconto (%)</label>
            <input type="number" id="coupon-discount" class="form-control" min="1" max="100" required>
          </div>
          <div class="form-group">
            <label for="coupon-limit">Limite de uso</label>
            <input type="number" id="coupon-limit" class="form-control" min="1" required>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="coupon-start">Início</label>
            <input type="date" id="coupon-start" class="form-control" required>
          </div>
          <div class="form-group">
            <label for="coupon-end">Fim</label>
            <input type="date" id="coupon-end" class="form-control" required>
          </div>
        </div>
        <p class="error"></p>
        <button type="submit" class="btn-primary" style="width:100%;">Criar cupom</button>
      </form>
    </div>
  </div>

  <script type="module" src="./../../js/pages/admin-coupon.js"></script>
</body>

</html>
