<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Astra - Carrinho</title>

    <link rel="stylesheet" href="css/base/reset.css">
    <link rel="stylesheet" href="css/base/variables.css">
    <link rel="stylesheet" href="css/base/global.css">
    <link rel="stylesheet" href="css/components/header.css">
    <link rel="stylesheet" href="css/components/footer.css">
    <link rel="stylesheet" href="css/components/card.css">
    <link rel="stylesheet" href="css/components/loading.css">

    <link rel="stylesheet" href="css/pages/carrinho.css">
    <link rel="stylesheet" href="./../../css/theme.css">
    <script src="./../../js/theme.js"></script>

    <link rel="shortcut icon" href="./assets/icons/logo.jpg" type="image/x-icon">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

    <header class="header">
        <a href="#" class="logo">
            <img src="./assets/icons/logo.jpg" alt="Logo Astra">
            <span>astra</span>
        </a>
    </header>


    <main class="carrinho">

        <a href="catalogo.html" class="voltar">
            <span class="seta">‹</span>
            Continuar comprando
        </a>

        <h1>Carrinho</h1>


        <section class="produtos">

        </section>


        <section class="resumo">

            <div class="resumo-linha">
                <span>Subtotal</span>
                <strong id="subtotal">R$ 00,00</strong>
            </div>

            <div class="resumo-linha">
                <span>Frete</span>
                <strong id="frete">Grátis</strong>
            </div>

            <div class="divisor"></div>

            <div class="resumo-total">
                <span>Total</span>
                <strong id="total">R$ 00,00</strong>
            </div>

            <p class="error"></p>

        </section>

        <a href="checkout.html" class="finalizar-container">
            <button class="btn-finalizar" type="button">
                <span>Finalizar compra</span>
            </button>
        </a>

    </main>

    <footer class="footer">
        <div class="footer-container">
            <div class="footer-brand">
                <a href="index.html" class="brand-logo">
                    <img class="logo-icon" src="./assets/images/logo.png" alt="logo">
                    <span class="logo-text">astra</span>
                </a>
                <p>A loja definitiva para colecionadores.<br>Edições raras, exclusivas globais e drops semanais.</p>
                <div class="social-links">
                    <a href="#" class="social-logo" title="WhatsApp"><img src="./assets/icons/whatsapp.svg"
                            alt="whatsapp"></a>
                    <a href="#" class="social-logo" title="Instagram"><img src="./assets/icons/instagram.svg"
                            alt="instagram"></a>
                    <a href="#" class="social-logo" title="E-mail"><img src="./assets/icons/gmail.svg" alt="gmail"></a>
                </div>
            </div>

            <div class="footer-links">
                <div class="footer-col">
                    <h2>Loja</h2>
                    <a href="catalogo.html">Catálogo</a>
                    <a href="#">Lançamentos</a>
                    <a href="#">Exclusivos</a>
                    <a href="#">Mais Vendidos</a>
                </div>

                <div class="footer-col">
                    <h2>Ajuda</h2>
                    <a href="#">Entregas</a>
                    <a href="#">Trocas e Devoluções</a>
                    <a href="#">FAQ</a>
                    <a href="#">Suporte</a>
                </div>
            </div>
        </div>
    </footer>

    <script type="module" src="./js/pages/carrinho.js"></script>

</body>

</html>
