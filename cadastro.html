<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="/css/pages/cadastro.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Astra - Cadastro</title>
</head>

<body>
    <div class="background">

        <a href="login.html" class="voltar">
            <span class="material-symbols-outlined">arrow_back</span>
        </a>

        <div class="card">

            <div class="logo">
                <img src="/assets/images/logoAstra.png" alt="astra logo">
            </div>

            <h1>Comece agora!</h1>
            <p class="subtitulo">
                Por favor, entre com suas credenciais
            </p>

            <form>

                <div class="inputt">
                    <label>Nome completo</label>
                    <input type="text">
                </div>

                <div class="inputt">
                    <label>CPF</label>
                    <input type="text">
                </div>

                <div class="inputt">
                    <label>Email</label>
                    <input type="email">
                </div>

                <div class="container-botao">
                    <a href="cadastro2.html" class="btn-proximo">Próximo</a>
                </div>
            </form>

        </div>

    </div>
</body>

</html>
