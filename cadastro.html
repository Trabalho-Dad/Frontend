<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="/css/pages/cadastro.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
    <link rel="stylesheet" href="./css/pages/cadastro.css">
    <link rel="shortcut icon" href="./assets/icons/logo.jpg" type="image/x-icon">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Astra - Cadastro</title>
</head>

<body>
    <div class="background">

        <div class="card">

            <div class="logo">
                <a href="./pages/auth/login.html" class="voltar" aria-label="Voltar para a página de login">
                    <span class="material-symbols-outlined">arrow_back</span>
                </a>
                <img src="./assets/images/logoAstra.png" alt="astra logo">
            </div>

            <div>
                <h1>Comece agora!</h1>
                <p class="subtitulo">
                    Por favor, entre com suas credenciais
                </p>
            </div>

            <form>

                <div class="inputt">
                    <label>Nome completo</label>
                    <input type="text" id="fullName" placeholder="Digite seu nome aqui">
                </div>

                <div class="inputt">
                    <label>CPF</label>
                    <input type="text" id="cpf" placeholder="___.___.___-__">
                </div>

                <div class="inputt">
                    <label>Email</label>
                    <input type="email" id="email" placeholder="Digite seu e-mail aqui">
                </div>

                <p id="login-error" class="login-error"></p>

                <div class="container-botao">
                    <button class="btn-proximo" type="submit">Próximo</button>
                </div>

                <p class="bottom-link">
                    Já possui conta?
                    <a href="./pages/auth/login.html" id="abrirPopup">Faça login</a>
                </p>
            </form>

        </div>

    </div>

    <script type="module" src="./js/pages/register.js"></script>
</body>

</html>
